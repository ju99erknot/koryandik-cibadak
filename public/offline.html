<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tidak Ada Koneksi — Koryandik Cibadak</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    .box { max-width: 420px; }
    img { width: 72px; height: 72px; object-fit: contain; margin-bottom: 20px; }
    h1 { font-size: 20px; font-weight: 800; margin: 0 0 10px; letter-spacing: -0.02em; }
    p { font-size: 14px; line-height: 1.65; color: #94a3b8; margin: 0 0 22px; }
    button {
      background: #3b82f6;
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 11px 22px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    .hint { margin-top: 22px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/logo.png" alt="Logo Koryandik Cibadak" />
    <h1>Tidak Ada Koneksi Internet</h1>
    <p>
      Koryandik tidak dapat memuat halaman karena perangkat Anda sedang offline.
      Periksa koneksi Wi-Fi atau data seluler, lalu muat ulang.
    </p>
    <button onclick="location.reload()">Coba Lagi</button>
    <div class="hint">
      Berkas yang sudah diunggah tetap tersimpan &mdash; tidak ada data yang hilang.
    </div>
  </div>
</body>
</html>
